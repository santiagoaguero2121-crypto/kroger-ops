<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Logística — Guías de Rastreo</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#0f2a4a;--blue:#1a5fa8;--border:#c8ddf0;--text:#0f1c2e;
  --muted:#4a6a8a;--white:#fff;--pale:#f2f7fd;--ok:#1a6b3a;--okl:#e2f5eb;
  --danger:#991f1f;--dangerl:#fceaea;--light:#deeaf7;--warn:#EF9F27;--warnl:#FAEEDA;
}
body{font-family:system-ui,-apple-system,sans-serif;background:#eef2f7;color:var(--text);font-size:13px;min-height:100vh}
.wrap{max-width:1600px;margin:0 auto;padding:1.25rem}

/* HEADER */
.log-hero{background:var(--navy);border-radius:16px;padding:1.25rem 1.75rem;margin-bottom:1.25rem;display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap}
.log-hero-l{display:flex;align-items:center;gap:14px}
.log-hero-icon{width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;font-size:20px;color:#9bc4e8;flex-shrink:0}
.log-hero-title{font-size:17px;font-weight:800;color:#fff}
.log-hero-sub{font-size:11px;color:rgba(255,255,255,.5);margin-top:2px}
.log-hero-stats{display:flex;gap:10px;flex-wrap:wrap}
.lstat{background:rgba(255,255,255,.07);border-radius:10px;padding:8px 14px;border:1px solid rgba(255,255,255,.08);min-width:76px;text-align:center}
.lstat .ln{font-size:18px;font-weight:800;color:#fff;font-family:monospace;line-height:1}
.lstat .ll{font-size:8.5px;color:rgba(255,255,255,.45);text-transform:uppercase;letter-spacing:.06em;margin-top:3px}
.lstat.warn .ln{color:#ffd08a}
.lstat.danger .ln{color:#F09595}
.lstat.ok .ln{color:#7be0ab}

/* TOOLBAR */
.toolbar{background:var(--white);border:0.5px solid var(--border);border-radius:14px;padding:1rem 1.25rem;margin-bottom:1rem;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tb-search{flex:1;min-width:200px;position:relative}
.tb-search i{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:14px}
.tb-search input{width:100%;padding:.6rem .9rem .6rem 2.2rem;border:1.5px solid var(--border);border-radius:9px;font-size:12.5px;font-family:inherit;color:var(--text)}
.tb-search input:focus{outline:none;border-color:var(--blue)}
.tb-select{padding:.6rem .8rem;border:1.5px solid var(--border);border-radius:9px;font-size:12.5px;font-family:inherit;color:var(--text);background:var(--white)}
.tb-select:focus{outline:none;border-color:var(--blue)}
.btn{padding:.6rem 1rem;border-radius:9px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;border:none;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn-navy{background:var(--navy);color:#fff}
.btn-navy:hover{background:var(--blue)}
.btn-outline{background:var(--white);color:var(--navy);border:1.5px solid var(--border)}
.btn-outline:hover{background:var(--pale)}
.btn-ghost{background:transparent;color:var(--muted);border:1.5px solid var(--border)}
.btn-ghost:hover{background:var(--pale)}
input[type=file]{display:none}

/* TABLE */
.tbl-card{background:var(--white);border:0.5px solid var(--border);border-radius:14px;overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:12px}
thead th{text-align:left;font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:10px 12px;background:var(--pale);border-bottom:1.5px solid var(--border);white-space:nowrap}
tbody td{padding:9px 12px;border-bottom:0.5px solid #f0f4f8;vertical-align:middle}
tbody tr:hover td{background:#f8fbff}
tbody tr:last-child td{border-bottom:none}
.g-num{font-family:monospace;font-weight:700;color:var(--navy)}
.g-po{font-family:monospace;color:var(--muted);font-size:11px}
.badge{font-size:9.5px;padding:3px 9px;border-radius:20px;font-weight:700;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.b-pendiente{background:#f0f0f0;color:#5a5a5a}
.b-transito{background:var(--light);color:var(--blue)}
.b-entregado{background:var(--okl);color:var(--ok)}
.b-retrasado{background:var(--dangerl);color:var(--danger)}
.b-excepcion{background:var(--warnl);color:#633806}
.row-actions{display:flex;gap:6px}
.ic-btn{width:26px;height:26px;border-radius:6px;border:0.5px solid var(--border);background:var(--white);color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px}
.ic-btn:hover{background:var(--pale);color:var(--navy)}
.ic-btn.del:hover{background:var(--dangerl);color:var(--danger);border-color:#f09595}
.empty-state{text-align:center;padding:3rem 1rem;color:var(--muted)}
.empty-state i{font-size:36px;color:#c8ddf0;display:block;margin-bottom:.75rem}

/* PAGINATION */
.pg-bar{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-top:1px solid var(--border);background:var(--pale)}
.pg-info{font-size:11px;color:var(--muted)}
.pg-btns{display:flex;gap:6px;align-items:center}
.pg-btn{width:28px;height:28px;border-radius:7px;border:1px solid var(--border);background:var(--white);color:var(--navy);cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center}
.pg-btn:hover:not(:disabled){background:var(--light)}
.pg-btn:disabled{opacity:.4;cursor:default}
.pg-cur{font-size:11px;color:var(--navy);font-weight:700;padding:0 6px;font-family:monospace}

/* MODAL */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(15,28,46,.55);z-index:500;align-items:center;justify-content:center;padding:1rem}
.modal-bg.show{display:flex}
.modal-card{background:var(--white);border-radius:16px;padding:1.5rem;width:100%;max-width:560px;max-height:90vh;overflow-y:auto}
.modal-hdr{display:flex;align-items:center;justify-content:between;margin-bottom:1.1rem;padding-bottom:.85rem;border-bottom:1px solid var(--border)}
.modal-title{font-size:15px;font-weight:700;color:var(--navy);flex:1}
.modal-close{background:none;border:none;font-size:18px;color:var(--muted);cursor:pointer;line-height:1}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:.85rem}
.mfield{margin-bottom:0}
.mfield.full{grid-column:1/-1}
.mfield label{display:block;font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:.4rem}
.mfield input,.mfield select,.mfield textarea{width:100%;padding:.6rem .8rem;border:1.5px solid var(--border);border-radius:8px;font-size:12.5px;font-family:inherit;color:var(--text)}
.mfield textarea{resize:vertical;min-height:60px}
.mfield input:focus,.mfield select:focus,.mfield textarea:focus{outline:none;border-color:var(--blue)}
.modal-footer{display:flex;gap:8px;margin-top:1.25rem;justify-content:flex-end}
.toast{position:fixed;bottom:20px;right:20px;background:var(--navy);color:#fff;padding:10px 18px;border-radius:10px;font-size:12px;font-weight:600;z-index:600;display:none;box-shadow:0 8px 24px rgba(15,42,74,.25)}
.toast.show{display:block}
</style>
</head>
<body>

<div class="wrap">
  <div class="log-hero">
    <div class="log-hero-l">
      <div class="log-hero-icon"><i class="ti ti-truck-delivery" aria-hidden="true"></i></div>
      <div>
        <div class="log-hero-title">Logística · Guías de Rastreo</div>
        <div class="log-hero-sub">Seguimiento de guías, carriers y estado de entrega por PO</div>
      </div>
    </div>
    <div class="log-hero-stats">
      <div class="lstat"><div class="ln" id="st-total">0</div><div class="ll">Total guías</div></div>
      <div class="lstat"><div class="ln" id="st-transito">0</div><div class="ll">En tránsito</div></div>
      <div class="lstat ok"><div class="ln" id="st-entregado">0</div><div class="ll">Entregadas</div></div>
      <div class="lstat danger"><div class="ln" id="st-retrasado">0</div><div class="ll">Retrasadas</div></div>
    </div>
  </div>

  <div class="toolbar">
    <div class="tb-search"><i class="ti ti-search" aria-hidden="true"></i><input type="text" id="search-inp" placeholder="Buscar por guía, PO, carrier o destino..."></div>
    <select class="tb-select" id="filter-estado">
      <option value="">Todos los estados</option>
      <option value="Pendiente">Pendiente</option>
      <option value="En tránsito">En tránsito</option>
      <option value="Entregado">Entregado</option>
      <option value="Retrasado">Retrasado</option>
      <option value="Excepción">Excepción</option>
    </select>
    <button class="btn btn-outline" id="btn-import"><i class="ti ti-file-spreadsheet" aria-hidden="true"></i> Importar Excel</button>
    <input type="file" id="file-import" accept=".xlsx,.xls,.csv">
    <button class="btn btn-outline" id="btn-export"><i class="ti ti-download" aria-hidden="true"></i> Exportar</button>
    <button class="btn btn-navy" id="btn-new"><i class="ti ti-plus" aria-hidden="true"></i> Nueva guía</button>
  </div>

  <div class="tbl-card">
    <div style="overflow-x:auto">
    <table>
      <thead><tr>
        <th>Guía</th><th>PO</th><th>Carrier</th><th>Destino</th><th>Estado</th>
        <th>Envío</th><th>Est. entrega</th><th>Entrega real</th><th>Notas</th><th></th>
      </tr></thead>
      <tbody id="tbody"></tbody>
    </table>
    </div>
    <div id="empty-wrap"></div>
    <div class="pg-bar" id="pg-bar">
      <div class="pg-info" id="pg-info"></div>
      <div class="pg-btns">
        <button class="pg-btn" id="pg-first"><i class="ti ti-chevrons-left" aria-hidden="true"></i></button>
        <button class="pg-btn" id="pg-prev"><i class="ti ti-chevron-left" aria-hidden="true"></i></button>
        <span class="pg-cur" id="pg-cur">1 / 1</span>
        <button class="pg-btn" id="pg-next"><i class="ti ti-chevron-right" aria-hidden="true"></i></button>
        <button class="pg-btn" id="pg-last"><i class="ti ti-chevrons-right" aria-hidden="true"></i></button>
      </div>
    </div>
  </div>
</div>

<!-- MODAL NUEVA/EDITAR GUIA -->
<div class="modal-bg" id="modal-bg">
  <div class="modal-card">
    <div class="modal-hdr">
      <div class="modal-title" id="modal-title">Nueva guía</div>
      <button class="modal-close" id="modal-close">✕</button>
    </div>
    <div class="form-grid">
      <div class="mfield"><label>Número de guía *</label><input type="text" id="f-guia" placeholder="1Z999AA10123456784"></div>
      <div class="mfield"><label>PO Kroger</label><input type="text" id="f-po" placeholder="4500123456"></div>
      <div class="mfield"><label>Carrier</label><input type="text" id="f-carrier" placeholder="UPS, FedEx, XPO..."></div>
      <div class="mfield"><label>Destino / Tienda</label><input type="text" id="f-destino" placeholder="Kroger #123 - Atlanta, GA"></div>
      <div class="mfield"><label>Estado</label>
        <select id="f-estado">
          <option>Pendiente</option>
          <option>En tránsito</option>
          <option>Entregado</option>
          <option>Retrasado</option>
          <option>Excepción</option>
        </select>
      </div>
      <div class="mfield"><label>Fecha de envío</label><input type="date" id="f-envio"></div>
      <div class="mfield"><label>Fecha estimada de entrega</label><input type="date" id="f-estimada"></div>
      <div class="mfield"><label>Fecha de entrega real</label><input type="date" id="f-real"></div>
      <div class="mfield full"><label>Notas</label><textarea id="f-notas" placeholder="Observaciones, novedades, excepciones..."></textarea></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" id="btn-cancel">Cancelar</button>
      <button class="btn btn-navy" id="btn-save"><i class="ti ti-check" aria-hidden="true"></i> Guardar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var STORE_KEY='dk_logistica_guias';
var GUIAS=[];
var EDIT_ID=null;
var PAGE=1;
var PAGE_SIZE=15;
var FILTERED=[];

function loadGuias(){
  try{ var s=localStorage.getItem(STORE_KEY); GUIAS = s? JSON.parse(s):[]; }
  catch(e){ GUIAS=[]; }
}
function saveGuias(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(GUIAS)); }catch(e){} }
function uid(){ return 'g'+Date.now()+Math.random().toString(36).slice(2,7); }

function badgeClass(estado){
  switch(estado){
    case 'En tránsito': return 'b-transito';
    case 'Entregado': return 'b-entregado';
    case 'Retrasado': return 'b-retrasado';
    case 'Excepción': return 'b-excepcion';
    default: return 'b-pendiente';
  }
}
function fmtDate(d){ if(!d) return '—'; return d; }

function applyFilters(){
  var q=(document.getElementById('search-inp').value||'').trim().toLowerCase();
  var est=document.getElementById('filter-estado').value;
  FILTERED = GUIAS.filter(function(g){
    var matchQ = !q || (g.guia||'').toLowerCase().indexOf(q)>-1 || (g.po||'').toLowerCase().indexOf(q)>-1 || (g.carrier||'').toLowerCase().indexOf(q)>-1 || (g.destino||'').toLowerCase().indexOf(q)>-1;
    var matchE = !est || g.estado===est;
    return matchQ && matchE;
  });
  FILTERED.sort(function(a,b){ return (b.envio||'').localeCompare(a.envio||''); });
  PAGE=1;
  renderTable();
}

function renderStats(){
  document.getElementById('st-total').textContent = GUIAS.length;
  document.getElementById('st-transito').textContent = GUIAS.filter(function(g){return g.estado==='En tránsito';}).length;
  document.getElementById('st-entregado').textContent = GUIAS.filter(function(g){return g.estado==='Entregado';}).length;
  document.getElementById('st-retrasado').textContent = GUIAS.filter(function(g){return g.estado==='Retrasado';}).length;
}

function renderTable(){
  var tbody=document.getElementById('tbody');
  var emptyWrap=document.getElementById('empty-wrap');
  var pgBar=document.getElementById('pg-bar');

  if(FILTERED.length===0){
    tbody.innerHTML='';
    emptyWrap.innerHTML='<div class="empty-state"><i class="ti ti-package-off" aria-hidden="true"></i>No hay guías que coincidan con la búsqueda.</div>';
    pgBar.style.display='none';
    renderStats();
    return;
  }
  emptyWrap.innerHTML='';
  pgBar.style.display='flex';

  var totalPages=Math.max(1,Math.ceil(FILTERED.length/PAGE_SIZE));
  if(PAGE>totalPages) PAGE=totalPages;
  var start=(PAGE-1)*PAGE_SIZE;
  var pageItems=FILTERED.slice(start,start+PAGE_SIZE);

  var rows='';
  pageItems.forEach(function(g){
    rows+='<tr>'
      +'<td class="g-num">'+esc(g.guia)+'</td>'
      +'<td class="g-po">'+esc(g.po||'—')+'</td>'
      +'<td>'+esc(g.carrier||'—')+'</td>'
      +'<td>'+esc(g.destino||'—')+'</td>'
      +'<td><span class="badge '+badgeClass(g.estado)+'">'+esc(g.estado||'Pendiente')+'</span></td>'
      +'<td>'+fmtDate(g.envio)+'</td>'
      +'<td>'+fmtDate(g.estimada)+'</td>'
      +'<td>'+fmtDate(g.real)+'</td>'
      +'<td style="max-width:180px;font-size:11px;color:var(--muted)">'+esc(g.notas||'')+'</td>'
      +'<td><div class="row-actions">'
      +'<button class="ic-btn" onclick="openEdit(\''+g.id+'\')" title="Editar"><i class="ti ti-edit" aria-hidden="true"></i></button>'
      +'<button class="ic-btn del" onclick="deleteGuia(\''+g.id+'\')" title="Eliminar"><i class="ti ti-trash" aria-hidden="true"></i></button>'
      +'</div></td>'
      +'</tr>';
  });
  tbody.innerHTML=rows;
  renderPg(totalPages);
  renderStats();
}

function esc(s){
  if(s===undefined||s===null) return '';
  return String(s).replace(/[&<>"']/g,function(c){
    return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
  });
}

function renderPg(totalPages){
  document.getElementById('pg-cur').textContent = PAGE+' / '+totalPages;
  var startN = FILTERED.length? ((PAGE-1)*PAGE_SIZE+1) : 0;
  var endN = Math.min(PAGE*PAGE_SIZE, FILTERED.length);
  document.getElementById('pg-info').textContent = startN+'–'+endN+' de '+FILTERED.length+' guías';
  document.getElementById('pg-first').disabled = PAGE<=1;
  document.getElementById('pg-prev').disabled = PAGE<=1;
  document.getElementById('pg-next').disabled = PAGE>=totalPages;
  document.getElementById('pg-last').disabled = PAGE>=totalPages;
}

function pgGo(where){
  var totalPages=Math.max(1,Math.ceil(FILTERED.length/PAGE_SIZE));
  if(where==='first') PAGE=1;
  else if(where==='prev') PAGE=Math.max(1,PAGE-1);
  else if(where==='next') PAGE=Math.min(totalPages,PAGE+1);
  else if(where==='last') PAGE=totalPages;
  renderTable();
}

// MODAL
function openNew(){
  EDIT_ID=null;
  document.getElementById('modal-title').textContent='Nueva guía';
  ['f-guia','f-po','f-carrier','f-destino','f-envio','f-estimada','f-real','f-notas'].forEach(function(id){document.getElementById(id).value='';});
  document.getElementById('f-estado').value='Pendiente';
  document.getElementById('modal-bg').classList.add('show');
  document.getElementById('f-guia').focus();
}
function openEdit(id){
  var g=GUIAS.find(function(x){return x.id===id;});
  if(!g) return;
  EDIT_ID=id;
  document.getElementById('modal-title').textContent='Editar guía';
  document.getElementById('f-guia').value=g.guia||'';
  document.getElementById('f-po').value=g.po||'';
  document.getElementById('f-carrier').value=g.carrier||'';
  document.getElementById('f-destino').value=g.destino||'';
  document.getElementById('f-estado').value=g.estado||'Pendiente';
  document.getElementById('f-envio').value=g.envio||'';
  document.getElementById('f-estimada').value=g.estimada||'';
  document.getElementById('f-real').value=g.real||'';
  document.getElementById('f-notas').value=g.notas||'';
  document.getElementById('modal-bg').classList.add('show');
}
function closeModal(){ document.getElementById('modal-bg').classList.remove('show'); }

function saveGuia(){
  var guia=document.getElementById('f-guia').value.trim();
  if(!guia){ showToast('El número de guía es obligatorio'); return; }
  var data={
    guia:guia,
    po:document.getElementById('f-po').value.trim(),
    carrier:document.getElementById('f-carrier').value.trim(),
    destino:document.getElementById('f-destino').value.trim(),
    estado:document.getElementById('f-estado').value,
    envio:document.getElementById('f-envio').value,
    estimada:document.getElementById('f-estimada').value,
    real:document.getElementById('f-real').value,
    notas:document.getElementById('f-notas').value.trim()
  };
  if(EDIT_ID){
    var idx=GUIAS.findIndex(function(x){return x.id===EDIT_ID;});
    if(idx>-1) GUIAS[idx]=Object.assign({id:EDIT_ID},data);
    showToast('✅ Guía actualizada');
  }else{
    data.id=uid();
    GUIAS.unshift(data);
    showToast('✅ Guía agregada');
  }
  saveGuias();
  closeModal();
  applyFilters();
}

function deleteGuia(id){
  if(!confirm('¿Eliminar esta guía de rastreo?')) return;
  GUIAS=GUIAS.filter(function(x){return x.id!==id;});
  saveGuias();
  applyFilters();
  showToast('Guía eliminada');
}

function showToast(msg){
  var t=document.getElementById('toast');
  t.textContent=msg;
  t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); },2400);
}

// IMPORT / EXPORT
function importExcel(file){
  var reader=new FileReader();
  reader.onload=function(e){
    try{
      var data=new Uint8Array(e.target.result);
      var wb=XLSX.read(data,{type:'array'});
      var sheet=wb.Sheets[wb.SheetNames[0]];
      var rows=XLSX.utils.sheet_to_json(sheet,{defval:''});
      var added=0;
      rows.forEach(function(r){
        var guia=String(r['Guia']||r['Guía']||r['Numero de guia']||r['Número de guía']||r['Tracking']||'').trim();
        if(!guia) return;
        GUIAS.unshift({
          id:uid(),
          guia:guia,
          po:String(r['PO']||r['Po']||'').trim(),
          carrier:String(r['Carrier']||r['Transportista']||'').trim(),
          destino:String(r['Destino']||r['Tienda']||'').trim(),
          estado:String(r['Estado']||'Pendiente').trim()||'Pendiente',
          envio:String(r['Envio']||r['Envío']||'').trim(),
          estimada:String(r['Estimada']||r['Fecha estimada']||'').trim(),
          real:String(r['Real']||r['Fecha real']||'').trim(),
          notas:String(r['Notas']||'').trim()
        });
        added++;
      });
      saveGuias();
      applyFilters();
      showToast('✅ '+added+' guías importadas');
    }catch(err){
      showToast('Error al leer el archivo');
    }
  };
  reader.readAsArrayBuffer(file);
}

function exportExcel(){
  var rows=GUIAS.map(function(g){
    return {
      'Guía':g.guia,'PO':g.po,'Carrier':g.carrier,'Destino':g.destino,'Estado':g.estado,
      'Envío':g.envio,'Fecha estimada':g.estimada,'Fecha real':g.real,'Notas':g.notas
    };
  });
  var ws=XLSX.utils.json_to_sheet(rows);
  var wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'Guias');
  XLSX.writeFile(wb,'guias_rastreo_'+new Date().toISOString().slice(0,10)+'.xlsx');
}

document.addEventListener('DOMContentLoaded',function(){
  loadGuias();
  applyFilters();

  document.getElementById('search-inp').addEventListener('input',applyFilters);
  document.getElementById('filter-estado').addEventListener('change',applyFilters);
  document.getElementById('btn-new').addEventListener('click',openNew);
  document.getElementById('btn-cancel').addEventListener('click',closeModal);
  document.getElementById('modal-close').addEventListener('click',closeModal);
  document.getElementById('btn-save').addEventListener('click',saveGuia);
  document.getElementById('modal-bg').addEventListener('click',function(e){ if(e.target.id==='modal-bg') closeModal(); });

  document.getElementById('pg-first').addEventListener('click',function(){pgGo('first');});
  document.getElementById('pg-prev').addEventListener('click',function(){pgGo('prev');});
  document.getElementById('pg-next').addEventListener('click',function(){pgGo('next');});
  document.getElementById('pg-last').addEventListener('click',function(){pgGo('last');});

  document.getElementById('btn-import').addEventListener('click',function(){ document.getElementById('file-import').click(); });
  document.getElementById('file-import').addEventListener('change',function(e){
    if(e.target.files && e.target.files[0]) importExcel(e.target.files[0]);
    e.target.value='';
  });
  document.getElementById('btn-export').addEventListener('click',exportExcel);
});
</script>
